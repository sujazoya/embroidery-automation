<!DOCTYPE html>
<html>
<head>
<title>Embroidery Dashboard</title>
<style>
body { font-family: Arial; padding:20px; }
.box { border:1px solid #ccc; padding:20px; border-radius:10px; }
</style>
</head>
<body>

<h2>Embroidery Upload System</h2>

<div class="box">
<input type="file" id="dst"><br><br>
<input type="file" id="img"><br><br>

<select id="cat">
<option value="YOUR_CAT_ID">General</option>
</select><br><br>

<button onclick="send()">Create Product</button>
</div>

<pre id="out"></pre>

<script>
async function send() {
    const fd = new FormData();
    fd.append("file", dst.files[0]);
    fd.append("image", img.files[0]);
    fd.append("category", cat.value);

    const res = await fetch("https://your-backend.onrender.com/create", {
        method: "POST",
        body: fd
    });

    const data = await res.json();
    out.innerText = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
